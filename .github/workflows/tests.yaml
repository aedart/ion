name: 'Tests'

on:
    push:
        branches: [main, master]
    pull_request:
    schedule:
        # Runs every day at 07:00 UTC
        - cron: '0 7 * * *'

jobs:
    monorepo_pipeline:
        name: 'Build & Test (Node ${{ matrix.node }} on ${{ matrix.os }})'
        runs-on: ${{ matrix.os }}

        strategy:
            fail-fast: true
            matrix:
                os: [ubuntu-latest]
                node: [24]

        steps:
            - name: 'Checkout'
              uses: actions/checkout@v6

            # 1. Setup pnpm
            - name: 'Install pnpm'
              uses: pnpm/action-setup@v6

            # 2. Setup Node 24 (No pnpm cache here to ensure a fresh fetch)
            - name: 'Use Node ${{ matrix.node }}'
              uses: actions/setup-node@v6
              with:
                  node-version: ${{ matrix.node }}

            # 3. Force Fresh Dependency Resolution
            # We ignore the lockfile and prefer the latest versions in range.
            - name: 'Install latest dependencies'
              run: pnpm install --no-frozen-lockfile

            # 4. Install Playwright Browsers (Required for Vitest)
            - name: 'Install Playwright Browsers'
              run: pnpm exec playwright install --with-deps chromium firefox

            # 5. Run the Pipeline
            - name: 'Check Formatting'
              run: pnpm format

            - name: 'Lint'
              run: pnpm lint

            - name: 'Type Check'
              run: pnpm type-check

            - name: 'Build'
              run: pnpm build

            - name: 'Test (Node & Headless Browsers)'
              run: pnpm test
